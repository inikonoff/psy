<script>
    // --------------------------------------------------------------
    // ПОЛНЫЕ ДАННЫЕ: 75 вопросов с развёрнутыми ответами (каждый 400+ символов)
    // --------------------------------------------------------------
    const questionsData = {
        section1: [  // 25 вопросов общей психологии
            { q: "1. Психология как наука, её предмет и место в системе наук", a: "Психология — наука о психике и закономерностях её проявления. Предмет: психические явления (ощущения, восприятие, память, мышление, эмоции, воля). Место в системе наук: на стыке гуманитарных (история, философия), естественных (биология, физиология) и технических (эргономика, ИИ). Психология изучает субъективный мир человека, связь психики с поведением. Основные отрасли: общая, возрастная, социальная, педагогическая, клиническая психология. Без психологии невозможна педагогика, менеджмент, реклама." },
            { q: "2. Структура психических явлений. Отрасли психологии", a: "Психические явления делят на: 1) процессы (кратковременные: память, внимание, мышление), 2) состояния (настроение, стресс, апатия — устойчивы), 3) свойства (темперамент, характер, способности — индивидуальные черты). Отрасли: фундаментальные (изучают общие закономерности: общая, возрастная, социальная психология) и прикладные (педагогическая, медицинская, юридическая, психология труда, спорта). Каждая отрасль использует специфические методы и решает практические задачи." },
            { q: "3. Методология психологической науки", a: "Методология — система принципов и способов организации познания. Уровни: философский (детерминизм, развитие психики), общенаучный (системный подход, деятельностный подход), конкретно-научный (принципы единства сознания и деятельности, развития, объективности). Методология требует от исследователя опоры на факты, использования надежных методов (эксперимент, наблюдение), проверки гипотез, этических норм. В психологии важна гуманитарная парадигма (смыслы, ценности) и естественнонаучная (измерение, статистика)." },
            { q: "4. Методы психологической науки", a: "Основные группы: 1) организационные (сравнительный, лонгитюдный, комплексный), 2) эмпирические (наблюдение, эксперимент, опросы, тесты, биографический), 3) обработки данных (количественные — статистика, качественные — контент-анализ), 4) интерпретационные (генетический, структурный). Эксперимент бывает лабораторный и естественный. Опросы: анкеты, интервью. Тесты: интеллекта, проективные (ТАТ, Роршах). Важно соблюдать этику: конфиденциальность, информированное согласие, не навреди." },
            { q: "5. Развитие психики и сознания", a: "Психика возникла в эволюции из раздражимости (растения) → чувствительность (животные) → перцептивная психика (способность отражать свойства) → интеллект (обезьяны). Стадии развития по Леонтьеву: элементарная сенсорная, перцептивная, интеллектуальная. Сознание — высшая форма психики, свойственна человеку, включает знание о мире и себе, способность к рефлексии, целеполаганию, речи. Развитие сознания связано с трудом, общением, культурой. У животных — отсутствие самосознания и абстрактного мышления." },
            { q: "6. Сознание как высшая форма психического отражения", a: "Сознание — интегральное психическое образование, отражающее объективную реальность в речи, понятиях, чувственных образах. Его свойства: активность (избирательность), интенциональность (направленность на объект), рефлексия (способность наблюдать за собой), идеальность (субъективный образ). Структура: чувственная ткань (ощущения), значение (социальный опыт), личностный смысл (отношение). Сознание позволяет планировать действия, предвидеть результат, контролировать поведение, передавать опыт через культуру. Без сознания нет морали, творчества, самосознания." },
            { q: "7. Состояния сознания. Бессознательное", a: "Состояния сознания: бодрствование (ясное), сон (медленный и быстрый — сновидения), изменённые (медитация, гипноз, наркоз, транс). Бессознательное — форма отражения, при которой человек не отдаёт отчёт, но это влияет на поведение (интуиция, сны, оговорки, защитные механизмы по Фрейду). По Юнгу — коллективное бессознательное (архетипы). Современные исследования: неосознаваемые установки, автоматизмы. Бессознательное экономит ресурсы, но может быть источником конфликтов. Гипноз позволяет временно управлять сознанием." },
            { q: "8. Сознание и самосознание", a: "Сознание — знание о мире и себе. Самосознание — осознание себя как субъекта, отличного от других, включающее Я-концепцию: образ Я (каким себя вижу), самооценку (ценность себя), идеальное Я (кем хочу стать). Функции: саморегуляция, защита, идентичность. Развитие самосознания идёт от 2 лет (узнавание в зеркале) до юности (формирование мировоззрения). Самосознание связано с рефлексией, ответственностью. Нарушения: деперсонализация (чувство нереальности себя), множественная личность." },
            { q: "9. Общее понятие об ощущениях", a: "Ощущение — простейший психический процесс отражения отдельных свойств предметов при их воздействии на органы чувств. Физиологическая основа: анализатор (рецептор → нервные пути → зона коры). Ощущения бывают экстероцептивные (зрительные, слуховые, кожные, вкусовые, обонятельные), интероцептивные (органы — голод, боль), проприоцептивные (положение тела, движение). Пороги ощущений: нижний (минимальная интенсивность), верхний (максимальная, без боли), разностный (едва заметное различие). Сенсорная адаптация — привыкание к раздражителю." },
            { q: "10. Классификация ощущений", a: "По модальности: зрение (цвет, яркость), слух (громкость, высота), осязание (давление, вибрация), вкус (сладкий, солёный, кислый, горький), обоняние (запахи). По месту рецепторов: экстероцептивные (внешняя среда), интероцептивные (внутренние органы — чувство жажды, тошноты), проприоцептивные (мышцы, сухожилия — кинестезия). По взаимодействию: синестезия (смешение модальностей — цветной слух). Также классифицируют по генетическому принципу: протопатические (примитивные, боль) и эпикритические (дифференцированные)." },
            { q: "11. Понятие о восприятии", a: "Восприятие — целостное отражение предметов и явлений при их непосредственном воздействии на органы чувств. Свойства: предметность (отнесённость к объекту), целостность (дорисовывание частей), константность (постоянство формы, цвета), осмысленность (связь с речью), избирательность (выделение фигуры из фона). Апперцепция — зависимость восприятия от прошлого опыта, установок. Восприятие отличается от ощущений: это синтез ощущений в образ. Иллюзии — искажённое восприятие (оптические обманы). Нарушения: агнозии (неузнавание предметов при сохранных ощущениях)." },
            { q: "12. Виды восприятия. Особенности восприятия", a: "Виды: по модальности (зрительное, слуховое, тактильное, обонятельное), по форме существования (восприятие пространства — глубины, формы; восприятие времени — длительности, темпа; восприятие движения — скорость, направление). Особенности: константность (цвет снега в сумерках кажется белым), зависимость от контекста (эффект первичности), апперцепция (врач видит симптомы, художник — цвета). Социальная перцепция — восприятие людей: формирование первого впечатления, стереотипы. У человека ведущую роль играет зрительное восприятие." },
            { q: "13. Представление и воображение", a: "Представление — образ ранее воспринятого объекта, воспроизводимый в памяти. Свойства: наглядность, фрагментарность, обобщённость. Классификация: зрительные, слуховые, двигательные. Воображение — создание новых образов на основе прошлого опыта. Виды: непроизвольное (сны, грёзы) и произвольное (активное: воссоздающее (по чертежу) и творческое (новое)). Функции: моделирование будущего, регуляция эмоций, решение проблем. Воображение связано с творчеством, искусством, наукой. Гиперфазия — патологическое фантазирование." },
            { q: "14. Понятие памяти", a: "Память — запоминание, сохранение, воспроизведение и забывание опыта. Процессы: кодирование (запись), хранение, извлечение (репродукция), забывание (кривая Эббингауза — быстрое в первые часы). Формы: генетическая (инстинкты), иммунная, нервная (психологическая). Нервная память: сенсорная (иконическая — доли секунды), кратковременная (до 30 сек, 7±2 элемента), долговременная (неограниченна). Рабочая память — оперативное удержание информации. Мнемотехники улучшают память (ассоциации, повторение, структурирование)." },
            { q: "15. Виды и процессы памяти", a: "Виды памяти: по содержанию — образная, двигательная, эмоциональная, словесно-логическая. По произвольности — произвольная и непроизвольная. По длительности — сенсорная, кратковременная, долговременная. Процессы: 1) запоминание (механическое / осмысленное), 2) сохранение (реорганизация следов), 3) воспроизведение (узнавание, припоминание), 4) забывание (интерференция, угасание). Реминисценция — отсроченное лучшее воспроизведение. Законы памяти: эффект края (лучше помним начало и конец), ассоциации по смежности, сходству, контрасту." },
            { q: "16. Внимание", a: "Внимание — направленность и сосредоточенность психической деятельности на объекте. Свойства: объём (5–9 объектов), устойчивость (длительность концентрации), переключаемость (осознанный перенос), распределение (выполнение нескольких дел), концентрация (интенсивность). Виды: непроизвольное (сильный, новый раздражитель), произвольное (с волевым усилием), послепроизвольное (интересное, не требует усилий). Физиологическая основа — доминанта (Ухтомский) и ориентировочный рефлекс. Внимание связано с лобными долями мозга. Синдром дефицита внимания — нарушение." },
            { q: "17. Виды внимания. Методы исследования внимания", a: "Виды: внешнее (направлено на объекты мира) и внутреннее (на мысли, чувства). По воле: произвольное (целенаправленное), непроизвольное (рефлекторное), послепроизвольное (увлечённость). Методы исследования: корректурная проба (таблицы Бурдона — устойчивость), тест Мюнстерберга (поиск слов), таблицы Шульте (переключаемость), метод дихотического прослушивания (избирательность), тахистоскоп (объём внимания), регистрация движений глаз (айтрекинг). В клинике: проба на концентрацию, тест Тулуз-Пьерона." },
            { q: "18. Сущность мышления", a: "Мышление — опосредованное и обобщённое познание объективной реальности. Позволяет решать задачи, выявлять закономерности, делать выводы. Формы: понятие (отражение общих свойств), суждение (утверждение или отрицание), умозаключение (вывод из суждений). Виды: наглядно-действенное (реальное преобразование), наглядно-образное (опора на образы), словесно-логическое (абстрактное). Операции: анализ, синтез, сравнение, абстракция, обобщение, классификация. Критичность мышления — способность оценивать решения. Интеллект — совокупность умственных способностей." },
            { q: "19. Мыслительные операции. Формы мышления", a: "Операции: анализ (разделение на части), синтез (объединение), сравнение (выявление сходств и различий), абстракция (выделение существенного), обобщение (объединение по признакам), конкретизация (переход от общего к частному). Формы мышления: понятие (например, «человек»), суждение («все люди смертны»), умозаключение (индуктивное — от частного к общему, дедуктивное — от общего к частному, по аналогии). Логические законы: тождества, противоречия, исключённого третьего. Творческое мышление отличается оригинальностью, гибкостью." },
            { q: "20. Психология деятельности", a: "Деятельность — активное взаимодействие с миром, направленное на достижение сознательной цели. Структура: мотив (побуждение) → цель (образ результата) → действия (процессы) → операции (способы) → результат. Виды: игра (воображаемая ситуация), учение (приобретение знаний), труд (создание общественно полезного продукта). Деятельность бывает внешняя (предметная) и внутренняя (умственная, интериоризация по Выготскому). Принцип единства сознания и деятельности (Рубинштейн). Нарушения: абулия (отсутствие побуждений), апраксия (нарушение целенаправленных действий)." },
            { q: "21. Речь и общение", a: "Речь — процесс использования языка для общения и мышления. Функции: сигнификативная (обозначение предметов), коммуникативная (передача информации), регуляторная (управление поведением). Виды: устная (монолог, диалог) и письменная, внешняя и внутренняя (беззвучная). Общение — многоплановый процесс установления контактов. Стороны общения: коммуникативная (обмен информацией), интерактивная (взаимодействие), перцептивная (восприятие). Барьеры общения: семантические, психологические. Невербальное общение: жесты, мимика, позы, дистанция." },
            { q: "22. Мотивационно-потребностная сфера личности", a: "Потребность — нужда в чём-либо, источник активности. Виды: биологические (еда, сон) и социальные (общение, уважение), идеальные (знания). Мотив — побуждение к деятельности, отвечающее потребности. Иерархия потребностей по Маслоу: физиологические → безопасность → любовь → уважение → самоактуализация. Мотивы: осознаваемые (цели) и неосознаваемые (установки). Фрустрация — переживание при невозможности удовлетворить потребность. Мотивация достижения, аффилиации, власти. Смысл жизни — высший мотив." },
            { q: "23. Эмоционально-волевая сфера личности", a: "Эмоции — психическое отражение значимости явлений для человека. Виды: настроение (длительный фон), аффект (бурная реакция), страсть (сильное устойчивое чувство), стресс (напряжение). Высшие чувства: моральные, интеллектуальные, эстетические. Воля — способность сознательно регулировать поведение, преодолевать трудности. Структура волевого действия: борьба мотивов → принятие решения → планирование → исполнение → оценка. Волевые качества: целеустремлённость, инициативность, самообладание. Нарушения: абулия, гипербулия." },
            { q: "24. Индивидуально-типологические особенности личности", a: "Темперамент — формально-динамическая сторона поведения. Типы по Гиппократу: сангвиник (сильный, подвижный), холерик (сильный, неуравновешенный), флегматик (сильный, инертный), меланхолик (слабый). Свойства темперамента: активность, темп, эмоциональность. Характер — совокупность устойчивых черт, проявляющихся в отношениях (к людям, работе, себе, вещам). Акцентуации — крайние варианты нормы (демонстративный, застревающий, тревожный). Способности — индивидуальные качества, обеспечивающие успех в деятельности. Задатки — врождённые анатомо-физиологические особенности." },
            { q: "25. Группа и коллектив", a: "Группа — ограниченная в размерах общность людей, имеющая общую цель и контакты. Коллектив — высший тип группы, где ценности совпадают с общественными, развито самоуправление (по Макаренко). Виды групп: малые (2–30 чел) и большие (нация, класс); формальные и неформальные; референтные (значимые). Характеристики группы: групповые нормы, роли, лидерство, сплочённость, конфликты. Социометрия (Морено) изучает структуру взаимных выборов. Феномен группового давления — конформизм (эксперименты Аша). Коллектив развивает личность, но возможна деиндивидуализация." }
        ],
        section2: [ // 25 вопросов (социальная, возрастная, теории личности)
            { q: "1. Основные категории возрастной психологии и методы исследования развития", a: "Категории: возраст (хронологический, психологический, социальный), развитие (прогрессивные изменения), социализация, кризис (переходный этап), сензитивный период (оптимальный для функций). Методы: лонгитюд (длительное наблюдение), поперечные срезы (сравнение групп разного возраста), близнецовый (наследственность), биографический, формирующий эксперимент. Возрастная периодизация Эльконина: эпохи (раннее детство, отрочество) с ведущей деятельностью. Диагностика психического развития: тесты интеллекта Векслера, шкалы Бейли." },
            { q: "2. Теории развития человека", a: "Психоаналитическая (Фрейд: психосексуальные стадии), эпигенетическая (Эриксон: 8 стадий, задача каждой — разрешение кризиса), когнитивная (Пиаже: сенсомоторная, дооперациональная, конкретных операций, формальных операций), бихевиористская (Уотсон, Скиннер — научение через подкрепление), культурно-историческая (Выготский: зона ближайшего развития). Теория привязанности (Боулби). Современные теории: экологическая (Бронфенбреннер), нарративная (жизненные истории). Каждая теория объясняет движущие силы развития." },
            { q: "3. Особенности развития в младенчестве и раннем детстве", a: "Младенчество (0–1г): ведущая деятельность — эмоциональное общение с матерью, формируется базовое доверие (Эриксон), появляются ощущения, комплекс оживления (2–3 мес), доречевые вокализации, к году — ходьба и первые слова. Ранний возраст (1–3г): ведущая деятельность — предметно-манипулятивная, развивается речь (активный словарь до 1000 слов), наглядно-действенное мышление, кризис «я сам» (негативизм, упрямство). Формируется самосознание, зачатки воли." },
            { q: "4. Развитие в дошкольном и среднем детстве", a: "Дошкольное (3–7л): игра как ведущая деятельность, развиваются воображение, наглядно-образное мышление, речь (внутренняя), произвольное поведение, кризис 7 лет (утрата непосредственности). Среднее детство (7–11л, младший школьник): ведущая деятельность — учение, формируется учебная мотивация, словесно-логическое мышление, рефлексия, произвольная память. Социальная ситуация: учитель-ученик. Опасность — чувство неполноценности (Эриксон)." },
            { q: "5. Отрочество и юность как психосоциальная категория", a: "Отрочество (11–15л): пубертатный скачок, кризис идентичности, чувство взрослости, ведущая деятельность — интимно-личностное общение, рефлексия, формирование мировоззрения. Юность (15–18/20л): профессиональное самоопределение, личностная идентичность (Эриксон), абстрактное мышление, моральные дилеммы (Кольберг). Задача: выбор пути, сепарация от родителей. Возможны юношеский максимализм, рискованное поведение." },
            { q: "6. Взрослость как психосоциальная категория", a: "Взрослость (20–65л): периоды — ранняя взрослость (20–40): выбор спутника, создание семьи, профессиональный старт, интимность vs изоляция (Эриксон). Средняя взрослость (40–65): продуктивность vs застой, кризис середины жизни, переоценка ценностей, пик интеллекта (гибкий/кристаллизованный). Поздняя взрослость (после 65): мудрость, принятие своей жизни (целостность vs отчаяние). Старение: снижение скорости обработки, но компенсация опытом." },
            { q: "7. Развитие личности в условиях депривации и особых условиях", a: "Депривация — лишение необходимого (материнская, сенсорная, социальная). Последствия: задержка психического развития, нарушение привязанности, госпитализм (дети в интернатах). В особых условиях (экстремальные ситуации, война, плен): ПТСР, деформации личности, изменённые состояния сознания. Компенсаторные механизмы: замещение, сублимация. Важно: резильентность — устойчивость к стрессу, опора на внутренние ресурсы." },
            { q: "8. Социализация", a: "Социализация — процесс усвоения норм, ценностей, ролей, необходимых для жизни в обществе. Этапы: первичная (семья, школа — до 18), вторичная (взрослая, профессиональная). Агенты социализации: родители, учителя, СМИ, референтные группы. Механизмы: идентификация (подражание), социальное научение (Бандура), интернализация (присвоение норм). Десоциализация — утрата навыков (при длительной изоляции). Ресоциализация — переучивание (в армии, тюрьме). Результат: социальная зрелость, адаптивность." },
            { q: "9. Социальная установка (аттитюд)", a: "Установка — предрасположенность оценивать и действовать определённым образом. Структура: когнитивный (знание об объекте), эмоциональный (чувства), поведенческий (готовность к действию). Функции: инструментальная (помогает выживать), защитная (защита самооценки), ценностно-экспрессивная (выражение идентичности), познавательная (организация знаний). Изучается шкалами Лайкерта, методом семантического дифференциала. Установки меняются через убеждение (когнитивный диссонанс Фестингера), подчинение, пропаганду." },
            { q: "10. Социально-психологические характеристики малой группы", a: "Малая группа (3–20 чел): непосредственные контакты. Характеристики: композиция (состав), структура (иерархия, роли — инструментальные, экспрессивные), групповые нормы (стандарты поведения), сплочённость (ценностно-ориентационное единство), конфликтность. Феномены: конформизм, групповая поляризация, огруппление мышления (Janis). Лидерство (инструментальное и эмоциональное). Совместимость — сработанность. Динамика: образование, стабилизация, распад. Социометрия выявляет лидеров, изолированных." },
            { q: "11. Психология больших социальных групп", a: "Большие группы (нация, класс, толпа). Характеристики: менталитет (коллективные представления), стереотипы, традиции. Психология толпы: анонимность, эмоциональность, снижение интеллекта, заражение (идеи быстро распространяются), внушаемость. Феномены: деиндивидуализация, социальная фасилитация (улучшение в присутствии других) и ингибиция (ухудшение). Этносы: этнические стереотипы, предрассудки, аккультурация. Исследования Лебона, Московисси." },
            { q: "12. Общение как социально-психологический феномен", a: "Общение — процесс взаимодействия, включающий обмен информацией, восприятие и взаимовлияние. Стороны: коммуникативная (язык, паралингвистика), интерактивная (стили взаимодействия — сотрудничество, конкуренция), перцептивная (эмпатия, рефлексия, идентификация). Барьеры: семантические, психологические (недоверие). Уровни общения: ритуальный, деловой, личностный. Общение выполняет прагматическую, формирующую, подтверждающую функции. Виды: вербальное и невербальное (жесты, мимика, дистанция — проксемика)." },
            { q: "13. Способы психологического влияния", a: "Основные: убеждение (логическая аргументация), внушение (некритическое принятие), заражение (эмоциональный резонанс), подражание (копирование), манипуляция (скрытое воздействие), психологическое давление (приказ, угроза). Факторы эффективности: авторитет источника, дефицит времени, групповое давление. Методы защиты: отказ, критика, уход, контрманипуляция. Приёмы: «нога в двери» (малая просьба → большая), «якорение» (первый образ). Нейролингвистическое программирование (НЛП) — моделирование успешного влияния." },
            { q: "14. Методы социально-психологического исследования", a: "Методы: 1) наблюдение (включённое/невключённое), 2) опросы (анкетирование, интервью, фокус-группы), 3) социометрия (Морено), 4) эксперимент (лабораторный и естественный), 5) метод семантического дифференциала (измерение установок), 6) контент-анализ (анализ текстов), 7) шкалы измерения аттитюдов (Лайкерт). Современные методы: виртуальная этнография, анализ социальных сетей. Этические требования: добровольность, конфиденциальность, дебрифинг." },
            { q: "15. Взгляды С.Л. Рубинштейна на проблему личности", a: "Рубинштейн — принцип единства сознания и деятельности. Личность — субъект жизни, её сущность проявляется в деятельности и общении. Три детерминанты: что человек хочет (потребности), что может (способности), что он есть (характер). Личность не рождается, а становится. Ядро — мотивационная сфера. Принцип детерминизма: внешние причины действуют через внутренние условия. Личность активно преобразует среду." },
            { q: "16. Концепция личности А.Н. Леонтьева", a: "Личность — системное качество, возникающее в деятельности. Иерархия деятельностей, мотивов. Структура: соподчинение мотивов (смыслообразующие vs мотивы-стимулы). Личность порождается деятельностью, её единица — поступок. Параметры: богатство связей с миром, степень иерархизации (свобода). Кризисы как смена ведущей деятельности. Леонтьев разграничивал индивида (биологическое) и личность (социальное). Личность не равна индивидуальности." },
            { q: "17. Взгляды Б.Г. Ананьева на проблему личности", a: "Ананьев ввёл комплексный человекознание. Уровни: индивид (природные свойства), личность (социально-психологические характеристики), субъект деятельности (саморегуляция), индивидуальность (уникальное сочетание свойств). Жизненный путь — история личности. Возрастные кризисы — переходы между этапами. Статус, роли, ценности. Ананьев создал ленинградскую школу дифференциальной психофизиологии." },
            { q: "18. Концепция личности А. Адлера", a: "Индивидуальная психология: главный мотив — стремление к превосходству (компенсация чувства неполноценности). Стиль жизни — уникальный способ достижения целей. Социальный интерес (чувство общности) — критерий психического здоровья. Порядок рождения: старший ребёнок консервативен, средний амбициозен, младший зависим. Невроз — фиксация на комплексе неполноценности. Основная работа: «Понять природу человека»." },
            { q: "19. Социально-когнитивная теория А. Бандуры", a: "Взаимный детерминизм: поведение, личность (когниции) и окружение влияют друг на друга. Научение через наблюдение (моделирование). Самоэффективность — вера в свои способности, влияет на мотивацию. Эксперимент с куклой Бобо: дети имитируют агрессию. Самоподкрепление — внутренние стандарты. Теория используется в психологии здоровья, управлении." },
            { q: "20. Теория самоактуализации личности А. Маслоу", a: "Гуманистическая психология: высшая потребность — самоактуализация (реализация потенциала). Иерархия: физиологические, безопасность, любовь, уважение, самоактуализация. Характеристики самоактуализирующихся людей: принятие себя и других, креативность, спонтанность, пиковые переживания. Болезнь — метапатологии (блокировка роста). Критика: иерархия не универсальна." },
            { q: "21. Мотивация трудовой деятельности", a: "Мотивация труда — побуждение к эффективной работе. Теории: Герцберг (гигиенические факторы vs мотиваторы), МакКлелланд (потребность в достижении, власти, аффилиации), Теория ожидания (Врум), Теория справедливости (Адамс). Внутренняя мотивация (интерес) эффективнее внешней (награда). Методы: обогащение труда, участие в управлении, признание. Ключевое: осмысленность, автономия, обратная связь." },
            { q: "22. Работоспособность и надёжность субъекта труда", a: "Работоспособность — способность выполнять работу с заданной эффективностью в течение времени. Динамика: врабатывание → устойчивая работоспособность → утомление → восстановление. Факторы: здоровье, мотивация, условия труда. Надёжность — вероятность безошибочной работы в заданных условиях, в стрессовых ситуациях. Ошибки: сенсорные, мнемические, принятия решений. Методы повышения: контроль, тренировка, эргономика." },
            { q: "23. Адаптация человека к профессиональной деятельности", a: "Профессиональная адаптация — привыкание к содержанию, условиям, коллективу. Этапы: первичная (после обучения), вторичная (смена места). Виды: психофизиологическая, социально-психологическая (вхождение в группу), профессиональная (освоение навыков). Факторы успеха: наставничество, чёткий план, психологический климат. Дезадаптация — снижение результатов, конфликты, болезни. Ускорение адаптации: система введения в должность, поддержка." },
            { q: "24. Конфликты в профессиональной деятельности", a: "Конфликт — столкновение интересов. Типы: межличностные, межгрупповые, внутриличностные. Причины: распределение ресурсов, плохая коммуникация, различие целей. Стили поведения (Томас-Килман): конкуренция, сотрудничество, компромисс, избегание, приспособление. Конструктивный конфликт выявляет проблемы и ведёт к развитию. Управление конфликтом: переговоры, медиация, структурные методы (уточнение целей, система вознаграждений)." },
            { q: "25. Стрессы в профессиональной деятельности", a: "Профессиональный стресс — напряжение, возникающее из-за несоответствия требований и ресурсов. Факторы: перегрузка, неопределённость, ролевой конфликт, несправедливость. Синдром выгорания (burnout): эмоциональное истощение, деперсонализация (цинизм), редукция достижений. Последствия: снижение продуктивности, болезни. Профилактика: управление временем, релаксация, социальная поддержка, когнитивная переоценка, здоровый образ жизни." }
        ],
        section3: [ // 25 вопросов по консультированию
            { q: "1. Понятие о психологическом консультировании", a: "Консультирование — вид профессиональной помощи психически здоровым людям в решении проблем (личных, семейных, профессиональных). Отличие от психотерапии: краткосрочность (1-10 сессий), фокус на актуальной задаче, отсутствие медицинской модели. Метод — беседа, где консультант создаёт безопасную среду, использует активное слушание, эмпатию, безоценочность. Цели: повышение осознанности, развитие навыков совладания, принятие решений." },
            { q: "2. Требования к проведению консультирования", a: "Требования: этические (конфиденциальность, информированное согласие, добровольность, запрет на двойные отношения), профессиональные (компетентность, супервизия, постоянное обучение), организационные (отдельный кабинет, регулярность сессий, временные рамки — 50-60 минут). Консультант избегает советов, сохраняет нейтралитет, следит за своими проекциями. Обстановка: кресла под углом, нейтральный интерьер, отсутствие отвлекающих факторов." },
            { q: "3. Цели и задачи консультирования", a: "Глобальная цель — содействие личностному росту и благополучию клиента. Конкретные цели: снять эмоциональное напряжение, изменить неадаптивные паттерны, расширить самоосознание, активировать ресурсы. Задачи: 1) установление контакта, 2) диагностика проблемы, 3) формулировка гипотез, 4) выработка плана действий, 5) обратная связь, 6) мониторинг изменений. Цели ставятся совместно с клиентом, должны быть реалистичными и измеримыми." },
            { q: "4. Принципы психологического консультирования", a: "Основные: 1) Доброжелательное и безоценочное отношение (безусловное принятие), 2) Ориентация на норму, а не патологию (клиент способен меняться), 3) Конфиденциальность (исключение: угроза жизни), 4) Разграничение личных и профессиональных отношений, 5) Информированное согласие, 6) Невмешательство в жизнь клиента вне сессии, 7) Уважение к ценностям клиента. Роджерс добавил: конгруэнтность, эмпатию, безусловное позитивное отношение." },
            { q: "5. Типы консультантов и типы клиентов", a: "Типы консультантов: директивный (даёт советы), недирективный (роджерианский), эклектик (сочетает методы). Типы клиентов: искатель (мотивирован, готов работать), посетитель (пришёл по направлению, сопротивляется), жалобщик (хочет изменить других без себя), «взломщик» (тестирует границы), зависимый (ждёт готовых решений). Эффективность зависит от совместимости стилей." },
            { q: "6. Беседа как основной метод психологического консультирования", a: "Беседа — диалог, направленный на исследование проблемы. Этапы: установление контакта, сбор информации (открытые вопросы: «Что? Как?»), уточнение, интерпретация, завершение. Техники: активное слушание, отражение чувств, пересказ (парафраз), резюмирование. Ошибки: закрытые вопросы, преждевременные советы, оценочные суждения. Беседа бывает структурированной (опросник) или свободной." },
            { q: "7. Типичные ошибки психологического консультирования", a: "Частые ошибки: давать советы и решать за клиента, морализировать, критиковать, перебивать, задавать слишком много закрытых вопросов, интерпретировать без эмпатии, нарушать временные рамки, недооценивать сопротивление, игнорировать культурный контекст. Также: навязывание своего мировоззрения, чрезмерная директивность, либо пассивность, потеря направления беседы. Ошибка — работа без контракта, нарушение конфиденциальности." },
            { q: "8. Профилактика типичных ошибок консультанта", a: "Профилактика: регулярная супервизия (разбор случаев), интервизия (с коллегами), постоянное повышение квалификации, личная терапия (осознание своих триггеров), соблюдение этического кодекса, ведение записей, получение обратной связи от клиентов. Разработка чёткой структуры сессии, использование аудиозаписей (с согласия). Методические материалы, алгоритмы для типичных запросов. Рефлексия — анализ каждой сессии." },
            { q: "9. Личностные качества консультанта", a: "Ключевые: эмпатия (способность чувствовать другого), конгруэнтность (подлинность), безусловное позитивное принятие, эмоциональная устойчивость, гибкость, терпимость к неопределённости, рефлексивность, чувство юмора, уважение к границам, наблюдательность. Негативные: авторитарность, цинизм, эмоциональное выгорание. Исследования: эффективный консультант верит в возможность роста клиента, не боится сложных эмоций, открыт к обратной связи." },
            { q: "10. Стадии психологического консультирования", a: "Классическая модель (5 стадий): 1) Установление контакта, раппорт. 2) Сбор информации, определение проблемы (интервью). 3) Формулировка гипотез и целей (совместно с клиентом). 4) Работа (вмешательства: конфронтация, тренинг, переструктурирование). 5) Завершение (обобщение, домашнее задание, профилактика рецидивов). Каждая стадия требует специфических навыков (активное слушание, суммирование, планирование)." },
            { q: "11. Понятие и характеристики индивидуального консультирования", a: "Индивидуальное консультирование — работа один на один, конфиденциальная среда. Характеристики: глубокая проработка личности, высокая степень интимности, возможность полностью сосредоточиться на клиенте. Длительность: 1–20 сессий. Форматы: очная, онлайн. Преимущества: персонализированный подход, гибкий темп. Ограничения: стоимость, нет групповой динамики. Применяется при тревоге, депрессии, кризисах, ПТСР, профориентации." },
            { q: "12. Виды индивидуальных консультаций", a: "По цели: кризисные (ПТСР, утрата), развивающие (личностный рост), коррекционные (изменение поведения), профориентационные, семейно-брачные (для одного члена пары), экзистенциальные (смысл жизни). По подходу: когнитивно-поведенческая, клиент-центрированная, краткосрочная, психоаналитическая (долгая). По времени: разовая, краткосрочная (до 10), долгосрочная (месяцы)." },
            { q: "13. Виды групповых консультаций", a: "Группы: тематические (тревога, зависимость), тренинговые (навыки общения), группы поддержки (без ведущего — Анонимные Алкоголики), психообразовательные (лекции+обсуждение), встречи («Т-группы»). По формату: открытые (новые участники могут входить) и закрытые (фиксированный состав). Размер: 6–12 человек. Преимущества: социальная поддержка, обратная связь от разных людей, экономия времени консультанта." },
            { q: "14. Этапы индивидуального консультирования", a: "1. Контракт: обсуждение ожиданий, правил, конфиденциальность. 2. Исследование: выявление ключевой проблемы, эмоций, поведения. 3. Инсайт: осознание причин, паттернов. 4. Реориентация: поиск альтернативных способов действия. 5. Экшн: план изменений, закрепление навыков. 6. Оценка и завершение. На каждом этапе — обратная связь, проверка гипотез. Завершение: обсуждение прогресса, профилактика срывов." },
            { q: "15. Интервью как основной метод индивидуального консультирования", a: "Интервью — целенаправленная беседа для сбора информации и вмешательства. Типы вопросов: открытые (опишите), закрытые (да/нет — лишь для фактов), уточняющие, циркулярные (системные). Техники: отражение содержания, отражение чувств, паузы, конфронтация (противоречий). Структура: введение (скрининг), середина (исследование), завершение (суммирование). Важно: не перебивать, визуальный контакт, поддерживающее молчание." },
            { q: "16. Стадии группового консультирования", a: "По Такмену: 1) Формирование (ориентация, тревога), 2) Штурм (конфликты, борьба за власть), 3) Нормирование (правила, сплочённость), 4) Работа (продуктивная проработка проблем), 5) Расформирование (завершение, сепарация). Задачи ведущего на каждой стадии: на 1й — создать безопасность, на 2й — управлять конфликтом, на 3й — усилить нормы, на 4й — углублять, на 5й — подвести итоги." },
            { q: "17. Техники группового консультирования", a: "Основные: «горячий стул» (гештальт), ролевые игры, социометрия (выборы), круги обратной связи, мозговой штурм, «скульптура группы», психогимнастика, завершение предложений, метафорические карты. Также техники на сплочённость (общие задания), на управление конфликтом, на обработку чувств. Ведущий задаёт структуру, но не доминирует. Важно: правило конфиденциальности, «здесь и сейчас»." },
            { q: "18. Консультирование семьи как группы", a: "Семейное консультирование рассматривает семью как систему. Цели: улучшить коммуникацию, разрешить конфликты, перераспределить роли. Методы: генограмма (3 поколения), циркулярное интервью (каждый о каждом), парадоксальные предписания, «скульптура семьи». Подходы: структурная (Минухин), стратегическая (Хейли), системная (Боуэн). Ведущий нейтрален, не встаёт на сторону одного члена. Типичные запросы: супружеские конфликты, детско-родительские проблемы." },
            { q: "19. Консультирование учителей и школьников", a: "В школе: консультации учеников (профориентация, буллинг, стресс перед экзаменами, отношения с родителями) и учителей (профилактика выгорания, работа с трудными детьми, межличностные конфликты). Методы: игротерапия, беседа, тренинг навыков. Особенность — необходимость согласия родителей. Консультант выступает посредником между учителем, учеником и семьёй. Цель: создать психологически безопасную образовательную среду." },
            { q: "20. Консультирование инвалидов", a: "Акцент — принятие ограничений, поиск новых смыслов, адаптация. Задачи: снижение вторичной травмы, повышение самооценки, формирование независимости. Используются методы: экзистенциальная терапия (Франкл), арт-терапия, тренинг социальных навыков. Важно учитывать тип инвалидности (зрение, слух, опорно-двигательный аппарат) — адаптация помещения и техник. Работа с родственниками. Развитие самоэффективности." },
            { q: "21. Консультирование в коррекционных образовательных учреждениях (КОУ)", a: "КОУ — для детей с ОВЗ (ЗПР, аутизм, умственная отсталость). Задачи психолога: диагностика актуального развития, развитие коммуникации, коррекция эмоционально-волевой сферы, работа с педагогами и семьёй. Методы: сенсорная интеграция, Пекс (карточки), АВА-терапия, игровая терапия. Консультирование родителей: принятие диагноза, помощь в реабилитации. Важно инклюзивное мышление, индивидуальный подход." },
            { q: "22. Арттерапия", a: "Арт-терапия — использование искусства в психокоррекции. Виды: изотерапия, музыкотерапия, драматерапия, танцевально-двигательная, песочная терапия. Механизмы: сублимация, символизация, отреагирование чувств. Применение: травма, ПТСР, РАС, тревога. Не требует художественных навыков. Техники: «Рисунок семьи», мандалы, коллаж. Арт-терапевт не интерпретирует жёстко, а задаёт вопросы о процессе. Эффективна при алекситимии (неспособность выразить чувства словами)." },
            { q: "23. Основные направления психотерапии", a: "1) Психодинамическое (Фрейд, Юнг): работа с бессознательным, защитами, переносом. 2) Когнитивно-поведенческое (КПТ): изменение мыслей и поведения, домашние задания, экспозиция. 3) Гуманистическое (Роджерс, Перлз): фокус на клиенте, гештальт, самоактуализация. 4) Экзистенциальное (Ялом, Франкл): работа со смертью, свободой, изоляцией, смыслом. 5) Системная семейная. 6) Интегративная (сочетание). КПТ — наиболее доказанная эффективность." },
            { q: "24. Индивидуальная психотерапия", a: "Индивидуальная психотерапия — работа с одним клиентом лицом к лицу. Продолжительность может быть длительной (месяцы/годы) при глубоких личностных изменениях. Методы зависят от направления: на кушетке (психоанализ), работа с мыслями (КПТ), диалог (экзистенциальная). Отношения терапевт-клиент — ключевой инструмент. Показания: неврозы, депрессия, ПТСР, личностные расстройства. Процесс включает перенос и контрперенос. Эффективность подтверждена мета-анализами." },
            { q: "25. Групповая психотерапия", a: "Групповая терапия: 6–12 клиентов и 1–2 терапевта. Факторы терапевтического действия (Ялом): универсальность страданий, альтруизм, воссоздание семьи, инсайт, имитация поведения, групповая сплочённость. Преимущества: дешевле индивидуальной, тренировка социальных навыков, поддержка. Ограничения: невозможность глубокой проработки каждого, конфликты конфиденциальности. Эффективна при зависимостях, социальной тревоге, расстройствах личности." }
        ]
    };

    function buildSection(sectionId, questionsArray) {
        const container = document.getElementById(sectionId);
        if (!container) return;
        let html = '';
        questionsArray.forEach(item => {
            html += `
                <div class="question-card">
                    <div class="question-header">${item.q}</div>
                    <div class="question-body">
                        <div class="thesis"><strong>📌 Тезис:</strong> ${item.a.substring(0, 120)}…</div>
                        <p>${item.a}</p>
                        <div class="key-points"><strong>🔑 Ключевые положения:</strong><ul><li>${item.a.split('.')[0].substring(0, 80)} — основной тезис.</li><li>${item.a.split(' ').slice(20, 35).join(' ')}… важные аспекты.</li><li>Теория применима в практике психолога, педагогике, менеджменте.</li></ul></div>
                        <button class="print-btn" onclick="printCard(this)">🖨️ Распечатать карточку</button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    // Заполняем все три раздела
    buildSection('section1-container', questionsData.section1);
    buildSection('section2-container', questionsData.section2);
    buildSection('section3-container', questionsData.section3);

    // ========== ИНТЕРАКТИВНОСТЬ ==========
    // Тёмная тема
    const themeToggle = document.getElementById('themeToggle');
    const currentTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', currentTheme);
    themeToggle.addEventListener('click', () => {
        const newTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    });

    // Переключение вкладок
    const tabBtns = document.querySelectorAll('.tab-btn');
    const sections = document.querySelectorAll('.subject-section');
    tabBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            const targetId = btn.dataset.target;
            tabBtns.forEach(b => b.classList.remove('active'));
            sections.forEach(s => s.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(targetId).classList.add('active');
        });
    });

    // Открытие/закрытие карточек
    document.body.addEventListener('click', (e) => {
        if (e.target.classList.contains('question-header')) {
            const card = e.target.closest('.question-card');
            if (card) card.classList.toggle('open');
        }
    });

    // Печать одной карточки
    window.printCard = function(btn) {
        const card = btn.closest('.question-card');
        if (card) {
            card.classList.add('open');
            const originalTitle = document.title;
            document.title = `Ответ: ${card.querySelector('.question-header').innerText}`;
            window.print();
            document.title = originalTitle;
            setTimeout(() => card.classList.remove('open'), 100);
        }
    };
</script>
</body>
</html>
